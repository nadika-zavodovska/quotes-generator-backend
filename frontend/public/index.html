<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote generator app</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./fetchQuote.js" defer></script>
</head>

<body>
    <div class="wrapper">
        <h1>Your inspiration ✨</h1>
        <p id="quote"></p>
        <p id="author"></p>
        <button type="button" id="new-quote">Select a new quote</button>
    </div>

    <!-- #region Add a new quote block -->
    <div class="add-quote-form-block">
        <h2>Add a new quote</h2>
        <form id="quote-form">
            <input type="text" id="new-quote-text" placeholder="Quote" required />
            <input type="text" id="new-quote-author" placeholder="Author" required />
            <button type="submit">Submit</button>
        </form>
        <div id="form-status-message"></div>
    </div>
    <!-- #endregion Add a new quote block -->    
</body>

</html>
